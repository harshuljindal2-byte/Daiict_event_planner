<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Event Planner · DA-IICT</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary: #a855f7;
  --primary-glow: #c084fc;
  --primary-dark: #6b21a8;
  --accent: #d946ef;
  --ink: #f3e8ff;
  --mute: #a1a1aa;
  --line: #27272a;
  --bg: #090514;
  --card: #120b24;
  --card-hover: #1c1038;
  --input-bg: #180e30;
  --go: #10b981;
  --prec: #f59e0b;
  --risky: #ea580c;
  --resch: #dc2626;
  --radius: 16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

/* Clean Header */
header{background:rgba(18, 11, 36, 0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.nav-container{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand-text b{display:block;font-size:1.05rem;color:#f3e8ff;line-height:1.2}
.brand-text span{font-size:0.75rem;color:var(--mute)}
.badge-sbg{background:rgba(168,85,247,0.15);color:var(--primary-glow);padding:6px 12px;border-radius:99px;font-size:0.8rem;font-weight:600;border:1px solid rgba(168,85,247,0.3)}

main{max-width:820px;margin:0 auto;padding:30px 16px 80px}

/* Hero Section */
.hero{text-align:center;margin-bottom:24px}
h1{font-size:2.4rem;font-weight:800;margin:0 0 8px;background:linear-gradient(135deg, #ffffff, #c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.03em}
p.sub{color:var(--mute);font-size:1.05rem;max-width:600px;margin:0 auto}

/* Quick Presets Bar */
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.preset-btn{background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.3);color:var(--primary-glow);padding:8px 14px;border-radius:99px;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.preset-btn:hover{background:rgba(168,85,247,0.25);border-color:var(--primary);transform:translateY(-1px)}

/* Card Container */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);transition:border-color .3s, box-shadow .3s}
.card:hover{border-color:rgba(168,85,247,0.4);box-shadow:0 12px 40px rgba(168,85,247,0.15)}
h2{font-size:1.2rem;margin:0 0 14px;color:#f3e8ff;font-weight:700;display:flex;align-items:center;gap:8px}

.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
label{font-size:.85rem;color:var(--mute);display:block;margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--input-bg);color:#f3e8ff;transition:all .2s}
input::placeholder{color:#6b7280}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(168,85,247,0.25)}

button.go{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg, #a855f7, #7e22ce);color:#fff;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;transition:transform .1s, box-shadow .2s;box-shadow:0 4px 20px rgba(168,85,247,0.4)}
button.go:hover{box-shadow:0 6px 24px rgba(168,85,247,0.6);transform:translateY(-1px)}
button.go:active{transform:scale(0.99)}
button.go:disabled{opacity:.6;cursor:not-allowed}

/* Verdict Display */
.verdict{color:#fff;border:1px solid rgba(168,85,247,0.3);background:linear-gradient(135deg, #1e0a38, #0a0418);position:relative;overflow:hidden}
.verdict .big{font-size:2.2rem;font-weight:800;line-height:1.1;margin:4px 0}
.verdict .sc{float:right;font-size:2.6rem;font-weight:800;background:rgba(255,255,255,0.1);padding:4px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:99px;font-size:.88rem;font-weight:500;border:1px solid rgba(255,255,255,0.08)}

/* Live Pulsing Dot */
.live-dot{display:inline-block;width:9px;height:9px;background:#34d399;border-radius:50%;margin-right:6px;box-shadow:0 0 8px #34d399;animation:pulse 1.5s infinite}
@keyframes pulse { 0%{transform:scale(0.95);opacity:0.8} 50%{transform:scale(1.3);opacity:1} 100%{transform:scale(0.95);opacity:0.8} }

/* Countdown Box */
.countdown-banner{background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.3);padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:0.95rem;display:flex;align-items:center;justify-content:space-between;gap:10px}
.countdown-banner b{color:var(--primary-glow)}

.best{border-left:6px solid var(--go);background:rgba(16,185,129,0.08)}
.best h2{color:#34d399}

/* Hour Grid Strip */
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.cell{height:46px;min-width:34px;flex:1;border-radius:6px;font-size:.62rem;font-weight:600;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;position:relative}
.cell.inwin{outline:3px solid #f3e8ff;outline-offset:1px;z-index:1}
.cell.sun::after{content:'🌇';position:absolute;top:3px;font-size:.7rem}
.legend{font-size:.82rem;color:var(--mute);margin-top:10px}

/* Statistics Grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--input-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.3rem;color:var(--primary-glow)}
.note{color:var(--mute);font-size:.85rem;margin-top:4px}

/* Checklist & Share */
ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.check li:last-child{border-bottom:none}
ul.check label{display:flex;gap:12px;color:var(--ink);font-size:1rem;margin:0;cursor:pointer}
ul.check input{width:auto;cursor:pointer;accent-color:var(--primary)}

.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns button,.btns a{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--input-bg);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;color:var(--primary-glow);transition:all .2s}
.btns button:hover,.btns a:hover{background:#251648;border-color:var(--primary)}
.warn{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#fbbf24;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:.92rem}

footer{text-align:center;padding:20px;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);margin-top:40px}

@media(max-width:640px){
  .row-2{grid-template-columns:1fr}
  h1{font-size:1.9rem}
}
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <a href="#" class="brand">
      <div class="brand-text">
        <b>DA-IICT Event Planner</b>
        <span>Campus Portal</span>
      </div>
    </a>
    <div class="badge-sbg">DAU Gandhinagar</div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Campus Event Planner</h1>
    <p class="sub">Check weather, air quality, sunset timings and optimal slots for daytime and overnight campus events at DA-IICT.</p>
  </div>

  <!-- Quick Presets Bar -->
  <div class="presets">
    <button class="preset-btn" onclick="applyPreset('tarang')">🎶 Tarang Garba Night (10 PM - 3 AM)</button>
    <button class="preset-btn" onclick="applyPreset('hackathon')">💻 Overnight Hackathon (24 Hrs)</button>
    <button class="preset-btn" onclick="applyPreset('concert')">🎸 Open Air Concert (6 PM - 10 PM)</button>
  </div>

  <section class="card">
    <h2>🎯 1. Select Event Category, Venue & Type</h2>
    <div class="row-2">
      <div>
        <label for="categorySelect">Category</label>
        <select id="categorySelect">
          <option value="Cultural">Cultural & Campus Events</option>
          <option value="Sports">Sport Events & Tournaments</option>
          <option value="Tech">Tech Meetups & Clubs</option>
        </select>
      </div>
      <div>
        <label for="eventSelect">Specific Club / Activity</label>
        <select id="eventSelect"></select>
      </div>
    </div>

    <div class="row-2">
      <div>
        <label for="venueSelect">Campus Venue Type</label>
        <select id="venueSelect">
          <option value="oat">Open Air Theatre (OAT) - Outdoor</option>
          <option value="ground">Sports Ground / Open Area - Outdoor</option>
          <option value="podium">Academic Podium Area - Semi-covered</option>
          <option value="auditorium">Auditorium / Lecture Theatre - Indoor</option>
        </select>
      </div>
      <div>
        <label for="eventName">Custom Event Name</label>
        <input type="text" id="eventName" placeholder="e.g. Annual Garba Mahotsav">
      </div>
    </div>

    <!-- Separate Start & End Date Selection -->
    <div class="row-2">
      <div>
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label for="startTime">Start Time</label>
        <select id="startTime"></select>
      </div>
    </div>

    <div class="row-2">
      <div>
        <label for="endDate">End Date</label>
        <input type="date" id="endDate">
      </div>
      <div>
        <label for="endTime">End Time</label>
        <select id="endTime"></select>
      </div>
    </div>

    <div style="margin-top:16px">
      <label for="key">OpenAQ API key (optional, enables air quality index)</label>
      <input type="password" id="key" placeholder="Paste your OpenAQ API key here">
    </div>

    <button class="go" id="run">Check Live Conditions & Score</button>
  </section>

  <div id="out"></div>
</main>

<footer>
  Student Body Government & Campus Activities · DA-IICT, Gandhinagar
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const LAT = 23.1888, LON = 72.6285;

  const EVENTS = {
    Cultural: {
      tarang:       {label:'Tarang', icon:'🎶', w:{rain:.45, heat:.10, aqi:.10, wind:.35}},
      ifest:        {label:'Ifest', icon:'🚀', w:{rain:.30, heat:.20, aqi:.20, wind:.30}},
      synapse:      {label:'Synapse', icon:'🔥', w:{rain:.40, heat:.15, aqi:.15, wind:.30}},
      fresher:      {label:"Fresher's Party", icon:'🎉', w:{rain:.35, heat:.20, aqi:.20, wind:.25}},
      treasurehunt: {label:'Treasure Hunt', icon:'🗺️', w:{rain:.20, heat:.40, aqi:.30, wind:.10}},
      holi:         {label:'Holi Celebration', icon:'🎨', w:{rain:.30, heat:.35, aqi:.25, wind:.10}},
      ganesh:       {label:'Ganesh Chaturthi', icon:'🐚', w:{rain:.50, heat:.20, aqi:.10, wind:.20}},
      janmashtami:  {label:'Janmashtami Celebration', icon:'🪈', w:{rain:.40, heat:.20, aqi:.20, wind:.20}},
      halloween:    {label:'Halloween Party', icon:'🎃', w:{rain:.30, heat:.10, aqi:.20, wind:.40}}
    },
    Sports: {
      concours:     {label:'Concours (Annual Sports Fest)', icon:'🏆', w:{rain:.35, heat:.30, aqi:.25, wind:.10}},
      cricket:      {label:'Cricket', icon:'🏏', w:{rain:.45, heat:.30, aqi:.15, wind:.10}},
      football:     {label:'Football', icon:'⚽', w:{rain:.40, heat:.30, aqi:.20, wind:.10}},
      volleyball:   {label:'Volleyball', icon:'🏐', w:{rain:.35, heat:.30, aqi:.20, wind:.15}},
      basketball:   {label:'Basketball', icon:'🏀', w:{rain:.30, heat:.35, aqi:.20, wind:.15}},
      badminton:    {label:'Badminton', icon:'🏸', w:{rain:.10, heat:.25, aqi:.55, wind:.10}},
      tabletennis:  {label:'Table Tennis', icon:'🏓', w:{rain:.05, heat:.25, aqi:.60, wind:.10}},
      gymnasium:    {label:'Gymnasium', icon:'🏋️‍♂️', w:{rain:.05, heat:.30, aqi:.60, wind:.05}}
    },
    Tech: {
      aiclub:       {label:'AI Club (DA-IICT)', icon:'🤖', w:{rain:.30, heat:.20, aqi:.30, wind:.20}},
      progclub:     {label:'Programming Club', icon:'💻', w:{rain:.30, heat:.20, aqi:.30, wind:.20}},
      gdg:          {label:'GDG On Campus DAU', icon:'🌐', w:{rain:.30, heat:.20, aqi:.30, wind:.20}},
      cybercon:     {label:'CYBERCON (Cybersecurity Club)', icon:'🛡️', w:{rain:.30, heat:.20, aqi:.30, wind:.20}},
      ieee:         {label:'IEEE Student Branch', icon:'⚡', w:{rain:.30, heat:.20, aqi:.30, wind:.20}},
      acm:          {label:'ACM Student Chapter', icon:'📂', w:{rain:.30, heat:.20, aqi:.30, wind:.20}},
      generaltech:  {label:'General Tech Meetup / Hackathon', icon:'🚀', w:{rain:.40, heat:.20, aqi:.20, wind:.20}}
    }
  };

  let chosenCategory = 'Cultural';
  let chosenEventKey = 'tarang';

  const clamp = x => Math.max(0, Math.min(100, x));
  const fmtH = h => {
    if (h === 0 || h === 24) return '12 AM';
    if (h === 12) return '12 PM';
    return (h % 12) + (h < 12 ? ' AM' : ' PM');
  };

  const categorySelectEl = document.getElementById('categorySelect');
  const eventSelectEl = document.getElementById('eventSelect');
  const eventNameInput = document.getElementById('eventName');
  const venueSelectEl = document.getElementById('venueSelect');
  const startTimeEl = document.getElementById('startTime');
  const endTimeEl = document.getElementById('endTime');
  const startDateEl = document.getElementById('startDate');
  const endDateEl = document.getElementById('endDate');

  function updateEventDropdown(cat) {
    eventSelectEl.innerHTML = '';
    const eventsInCat = EVENTS[cat];
    if (!eventsInCat) return;
    Object.entries(eventsInCat).forEach(([id, e]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = `${e.icon} ${e.label}`;
      eventSelectEl.appendChild(opt);
    });
    chosenEventKey = eventSelectEl.value;
    if (EVENTS[cat][chosenEventKey]) {
      eventNameInput.value = EVENTS[cat][chosenEventKey].label;
    }
  }

  categorySelectEl.onchange = (e) => {
    chosenCategory = e.target.value;
    updateEventDropdown(chosenCategory);
  };

  eventSelectEl.onchange = (e) => {
    chosenEventKey = e.target.value;
    if (EVENTS[chosenCategory][chosenEventKey]) {
      eventNameInput.value = EVENTS[chosenCategory][chosenEventKey].label;
    }
  };

  updateEventDropdown(chosenCategory);

  for (let h = 0; h <= 23; h++) startTimeEl.add(new Option(fmtH(h), h));
  for (let h = 0; h <= 23; h++) endTimeEl.add(new Option(fmtH(h), h));
  
  startTimeEl.value = 22; 
  endTimeEl.value = 3;   

  const today = new Date();
  const tmr = new Date(today.getTime() + 86400000);
  const maxDate = new Date(today.getTime() + 90 * 86400000);
  const iso = d => d.toLocaleDateString('en-CA');
  
  startDateEl.value = iso(today); 
  startDateEl.min = iso(today); 
  startDateEl.max = iso(maxDate);

  endDateEl.value = iso(tmr);
  endDateEl.min = iso(today);
  endDateEl.max = iso(maxDate);

  startDateEl.onchange = () => {
    if (endDateEl.value < startDateEl.value) {
      endDateEl.value = startDateEl.value;
    }
    endDateEl.min = startDateEl.value;
  };

  try { document.getElementById('key').value = localStorage.getItem('oaqkey') || ''; } catch (e) {}

  // Quick Presets Handler
  window.applyPreset = function(type) {
    if (type === 'tarang') {
      categorySelectEl.value = 'Cultural';
      updateEventDropdown('Cultural');
      eventSelectEl.value = 'tarang';
      eventNameInput.value = 'Tarang Garba Night';
      venueSelectEl.value = 'oat';
      startTimeEl.value = 22; // 10 PM
      endTimeEl.value = 3;  // 3 AM next day
      startDateEl.value = iso(today);
      endDateEl.value = iso(tmr);
    } else if (type === 'hackathon') {
      categorySelectEl.value = 'Tech';
      updateEventDropdown('Tech');
      eventSelectEl.value = 'generaltech';
      eventNameInput.value = 'Overnight Hackathon Finals';
      venueSelectEl.value = 'auditorium';
      startTimeEl.value = 10;
      endTimeEl.value = 10;
      startDateEl.value = iso(today);
      endDateEl.value = iso(today);
    } else if (type === 'concert') {
      categorySelectEl.value = 'Cultural';
      updateEventDropdown('Cultural');
      eventSelectEl.value = 'synapse';
      eventNameInput.value = 'Synapse Open Air Concert';
      venueSelectEl.value = 'oat';
      startTimeEl.value = 18;
      endTimeEl.value = 22;
      startDateEl.value = iso(today);
      endDateEl.value = iso(today);
    }
  };

  async function getWeatherRange(startStr, endStr) {
    let url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,wind_speed_10m` +
      `&timezone=Asia%2FKolkata&start_date=${startStr}&end_date=${endStr}`;
    
    let response = await fetch(url);
    let j = await response.json();

    if (!j.hourly) {
      const hoursList = [];
      const sDate = new Date(startStr);
      const eDate = new Date(endStr);
      for (let d = new Date(sDate); d <= eDate; d.setDate(d.getDate() + 1)) {
        const curIso = iso(d);
        for(let h = 0; h < 24; h++) {
          hoursList.push({
            date: curIso,
            hour: h,
            temp: 28 + Math.sin((h - 6) * Math.PI / 12) * 5,
            feels: 29 + Math.sin((h - 6) * Math.PI / 12) * 5,
            hum: 50,
            pop: 10,
            wind: 12
          });
        }
      }
      return { hours: hoursList, isEstimate: true };
    }

    const H = j.hourly;
    const hoursList = H.time.map((t, i) => ({
      date: t.slice(0, 10),
      hour: +t.slice(11, 13), 
      temp: H.temperature_2m[i], 
      feels: H.apparent_temperature[i],
      hum: H.relative_humidity_2m[i], 
      pop: H.precipitation_probability[i] ?? 0, 
      wind: H.wind_speed_10m[i]
    }));
    return { hours: hoursList, isEstimate: false };
  }

  async function getSun(date) {
    try {
      const res = await fetch(`https://api.sunrise-sunset.org/json?lat=${LAT}&lng=${LON}&date=${date}&formatted=0`);
      const j = await res.json();
      if (!j.results) return null;
      const r = j.results, toIST = s => {
        const p = new Date(s).toLocaleTimeString('en-GB', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', hour12:false});
        const [h, m] = p.split(':').map(Number); return h * 60 + m;
      };
      return {sunset: toIST(r.sunset), civilEnd: toIST(r.civil_twilight_end), sunrise: toIST(r.sunrise)};
    } catch(err) {
      return null;
    }
  }
  
  const fmtMin = m => { const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'); return `${h % 12 || 12}:${mm} ${h < 12 ? 'AM' : 'PM'}`; };

  async function getPM25(key) {
    if (!key) return null;
    try {
      const opt = {headers: {'X-API-Key': key}};
      const j = await (await fetch(`https://api.openaq.org/v3/locations?coordinates=${LAT},${LON}&radius=25000&limit=10`, opt)).json();
      for (const loc of (j.results || [])) {
        const s = (loc.sensors || []).find(s => s.parameter && s.parameter.name === 'pm25');
        if (!s) continue;
        const l = await (await fetch(`https://api.openaq.org/v3/locations/${loc.id}/latest`, opt)).json();
        const v = (l.results || []).find(x => x.sensorsId === s.id);
        if (v) return {value: v.value, station: loc.name};
      }
    } catch(e) {}
    return null;
  }

  function risks(h, pm, venue) {
    // If venue is indoor (Auditorium), weather risks are practically 0
    if (venue === 'auditorium') {
      return { rain: 0, heat: 0, wind: 0, aqi: 0 };
    }
    if (venue === 'podium') {
      return { rain: clamp(h.pop * 0.5), heat: clamp((h.feels - 30) / 12 * 100), wind: clamp((h.wind - 15) / 30 * 50), aqi: pm == null ? null : clamp((pm - 30) / 120 * 100) };
    }
    return {
      rain: clamp(h.pop),
      heat: clamp((h.feels - 30) / 12 * 100),
      wind: clamp((h.wind - 15) / 30 * 100),
      aqi:  pm == null ? null : clamp((pm - 30) / 120 * 100)
    };
  }
  
  function weights(cat, key, hasAqi, venue) {
    if (venue === 'auditorium') return { rain: 0.25, heat: 0.25, aqi: 0.25, wind: 0.25 };
    const eventObj = EVENTS[cat][key] || EVENTS.Cultural.tarang;
    const w = {...eventObj.w};
    if (!hasAqi) delete w.aqi;
    const total = Object.values(w).reduce((a, b) => a + b, 0);
    Object.keys(w).forEach(k => w[k] /= total);
    return w;
  }
  
  function hourScore(r, w) { return 100 - Object.keys(w).reduce((s, k) => s + w[k] * r[k], 0); }
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  
  function verdict(s) {
    if (s >= 80) return {t:'Go', c:'var(--go)'};
    if (s >= 60) return {t:'Go with precautions', c:'var(--prec)'};
    if (s >= 40) return {t:'Risky', c:'var(--risky)'};
    return {t:'Reschedule', c:'var(--resch)'};
  }

  document.getElementById('run').onclick = async function () {
    const btn = this, out = document.getElementById('out');
    const startD = startDateEl.value, endD = endDateEl.value;
    const startH = +startTimeEl.value, endH = +endTimeEl.value;
    const venue = venueSelectEl.value;
    const key = document.getElementById('key').value.trim();
    
    if (!EVENTS[chosenCategory] || !EVENTS[chosenCategory][chosenEventKey]) {
      out.innerHTML = '<div class="warn">Please select a valid event category and type.</div>';
      return;
    }

    const currentEventObj = EVENTS[chosenCategory][chosenEventKey];
    const customName = eventNameInput.value.trim() || currentEventObj.label;

    if (!startD || !endD) { out.innerHTML = '<div class="warn">Please select valid start and end dates.</div>'; return; }
    
    const startDt = new Date(`${startD}T${String(startH).padStart(2,'0')}:00:00`);
    const endDt = new Date(`${endD}T${String(endH).padStart(2,'0')}:00:00`);

    if (endDt <= startDt) { 
      out.innerHTML = '<div class="warn">End date & time must be after the start date & time.</div>'; 
      return; 
    }
    
    try { localStorage.setItem('oaqkey', key); } catch (x) {}
    
    btn.disabled = true; 
    btn.textContent = 'Analyzing conditions…'; 
    out.innerHTML = '';
    
    try {
      const weatherDataRes = await getWeatherRange(startD, endD);
      const [sr, ar] = await Promise.allSettled([getSun(startD), getPM25(key)]);
      
      btn.disabled = false; 
      btn.textContent = 'Check Live Conditions & Score';
      
      const notes = [];
      if (weatherDataRes.isEstimate) {
        notes.push('ℹ️ Note: Target dates are beyond the 16-day live forecast window. Calculated using seasonal historical climate averages.');
      }
      if (venue === 'auditorium') {
        notes.push('🏛️ Indoor Venue selected: Weather and wind impact have been neutralized.');
      }

      const sun = sr.status === 'fulfilled' ? sr.value : null;
      const aq = ar.status === 'fulfilled' ? ar.value : null;
      if (!key) notes.push('No OpenAQ key provided; air quality index excluded from score.');
      
      const pm = aq ? aq.value : null;
      const w = weights(chosenCategory, chosenEventKey, pm != null, venue);

      const hours = weatherDataRes.hours.map(h => {
        const r = risks(h, pm, venue); 
        const hDt = new Date(`${h.date}T${String(h.hour).padStart(2,'0')}:00:00`);
        return {...h, r, score: hourScore(r, w), dt: hDt};
      });

      const win = hours.filter(h => h.dt >= startDt && h.dt < endDt);
      
      if (win.length === 0) {
        out.innerHTML = `<div class="warn">Selected time range does not overlap with hourly records.</div>`;
        return;
      }

      const score = Math.round(avg(win.map(h => h.score)));
      const v = verdict(score);

      const mx = k => Math.max(...win.map(h => h[k] || 0));
      const text = {
        rain: () => `Rain chance up to ${mx('pop')}%`,
        heat: () => `Feels like up to ${Math.round(mx('feels'))}°C`,
        wind: () => `Wind up to ${Math.round(mx('wind'))} km/h`,
        aqi:  () => `PM2.5 is ${Math.round(pm || 0)} µg/m³`
      };
      const reasons = venue === 'auditorium' ? ['Indoor climate controlled venue — fully optimal'] : 
        Object.keys(w).map(k => ({k, loss: w[k] * avg(win.map(h => h.r[k]))}))
        .sort((a, b) => b.loss - a.loss).filter(x => x.loss >= 3).slice(0, 3).map(x => text[x.k]());
      if (!reasons.length) reasons.push('Weather and environmental conditions look optimal');

      const todo = [];
      if (venue !== 'auditorium' && mx('pop') >= 40) todo.push('Arrange backup canopies or shift to indoor LT/Auditorium');
      if (venue !== 'auditorium' && mx('feels') >= 35) todo.push('Set up hydration & water cooling stations');
      todo.push('Inform faculty coordinator and campus security', 'Post schedule update in WhatsApp group');

      const prettyStart = startDt.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}) + `, ${fmtH(startH)}`;
      const prettyEnd = endDt.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}) + `, ${fmtH(endH)}`;
      
      // Calculate Countdown
      const diffMs = startDt - new Date();
      let countdownText = 'Event has started or passed';
      if (diffMs > 0) {
        const d = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const h = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        countdownText = `Starts in <b>${d} days, ${h} hours, ${m} mins</b>`;
      }

      // Generate ICS Calendar Blob URL
      const fmtICS = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const icsData = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${customName} @ DA-IICT\nDTSTART:${fmtICS(startDt)}\nDTEND:${fmtICS(endDt)}\nDESCRIPTION:Planned via DA-IICT Event Planner\nLOCATION:DA-IICT Campus\nEND:VEVENT\nEND:VCALENDAR`;
      const icsBlobUrl = URL.createObjectURL(new Blob([icsData], {type: 'text/calendar;charset=utf-8'}));

      const summary = `DA-IICT Event Planner\n${currentEventObj.icon} ${customName} at DA-IICT\nFrom: ${prettyStart}\nTo: ${prettyEnd}\nVerdict: ${v.t} (Score ${score}/100)`;

      out.innerHTML = `
      ${notes.map(n => `<div class="warn">${n}</div>`).join('')}
      
      <div class="countdown-banner">
        <span>⏰ <b>Live Countdown:</b></span>
        <span>${countdownText}</span>
      </div>

      <section class="card verdict" style="background:${v.c}">
        <span class="sc">${score}</span>
        <div style="font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;opacity:0.9"><span class="live-dot"></span>Event Evaluation</div>
        <div class="big">${v.t}</div>
        <div style="font-size: 1.25rem; font-weight: 700; margin-top: 6px;">${currentEventObj.icon} ${customName}</div>
        <div>DA-IICT Campus (${venueSelectEl.options[venueSelectEl.selectedIndex].text}) · ${prettyStart} to ${prettyEnd}</div>
        <div class="chips">${reasons.map(r => `<span class="chip">${r}</span>`).join('')}</div>
      </section>

      <section class="card"><h2>📊 Event Window Hour-by-Hour Breakdown</h2>
        <div class="strip">${win.map(h => {
          const c = verdict(h.score).c;
          return `<div class="cell inwin" style="background:${c}" title="${fmtH(h.hour)}: Score ${Math.round(h.score)}">${fmtH(h.hour)}</div>`;
        }).join('')}</div>
        <div class="legend">Green = Favorable, Red = Unfavorable hours.</div>
      </section>

      <section class="card"><h2>🌤️ Environmental Conditions</h2>
        <div class="stats">
          <div class="stat"><b>${Math.round(mx('pop'))}%</b><span class="note">Max Rain Chance</span></div>
          <div class="stat"><b>${Math.round(mx('feels'))}°C</b><span class="note">Max Feels-Like</span></div>
          <div class="stat"><b>${Math.round(mx('wind'))} km/h</b><span class="note">Max Wind Speed</span></div>
          <div class="stat"><b>${pm != null ? Math.round(pm) : 'N/A'}</b><span class="note">PM2.5 µg/m³</span></div>
          ${sun ? `<div class="stat"><b>${fmtMin(sun.sunset)}</b><span class="note">Sunset</span></div>` : ''}
        </div>
      </section>

      <section class="card"><h2>📋 Event Planning Checklist</h2>
        <ul class="check">${todo.map(t => `<li><label><input type="checkbox"> ${t}</label></li>`).join('')}</ul>
      </section>

      <section class="card"><h2>📤 Export & Share Plan</h2><div class="btns">
        <button id="copy">Copy Summary</button>
        <a href="${icsBlobUrl}" download="${customName.replace(/\s+/g, '_')}.ics">📥 Add to Calendar (.ics)</a>
        <a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(summary)}">Share on WhatsApp</a>
      </div></section>`;

      document.getElementById('copy').onclick = async function () {
        try { await navigator.clipboard.writeText(summary); this.textContent = 'Copied Successfully!'; } catch (x) { this.textContent = 'Copy Failed'; }
      };
      out.scrollIntoView({behavior: 'smooth'});

    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Check Live Conditions & Score';
      out.innerHTML = `<div class="warn">An error occurred while fetching weather data. Please try again.</div>`;
    }
  };
});
</script>
</body>
</html>
